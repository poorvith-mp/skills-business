  - 'estimate story points and team velocity using planning poker guidelines'
  - 'structure our sprint backlog so commitments are realistic and dependencies clear'
  - 'run an effective sprint retrospective to uncover actionable process improvements'
  - 'handle scope creep when urgent bugs are injected into an active sprint'
  - 'break down large user stories into atomic tasks that fit within a single sprint'
  - 'calculate team capacity accounting for holidays, on-call rotations, and sick leave'
  - 'track sprint burndown progress and identify early signs of milestone slippage'
should_not_fire:
